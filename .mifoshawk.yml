documentation:
  enabled: true

  documents:
    - platform: gitbook
      repo: "Mohit-Davar/gitbook-mifos"
      branch: "main"
      path: "/getting-started"
      audience: user
      purpose: >
        User documentation for the Owlog blogging platform.
        Covers getting started, account creation, email verification,
        signing in, discovering articles, engagement features,
        profile management, privacy settings and troubleshooting.
    - platform: readme
      repo: "Mohit-Davar/readme-mifos"
      branch: "main"
      path: "/docs/Docs"
      audience: user
      purpose: >
        User documentation for the Owlog blogging platform.
        Covers getting started, account creation, email verification,
        signing in, discovering articles, engagement features,
        profile management, privacy settings and troubleshooting.
    - platform: confluence
      pageId: "7929869"
      audience: user
      purpose: >
        User documentation for the Owlog blogging platform.
        Covers getting started, account creation, email verification,
        signing in, discovering articles, engagement features,
        profile management, privacy settings and troubleshooting.

review:
  model: "gpt-5-mini"
  files:
    include:
      - "src/**"
    exclude:
      - "dist/**"
      - "**/*.lock"
  security:
    dependencyFiles:
      - "package.json"
      - "package-lock.json"
